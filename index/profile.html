<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Profile | CRUDTASK </title>
        <link rel="stylesheet" href="../css/global.css">
        <link rel="stylesheet" href="../css/task.css">
    </head>
    <body>
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="../img/Background.svg" alt="Logo" class="logo-icon">
                <span class="logo-text"> CRUDZASO </span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"> </path> </svg>
                    Dashboard
                </a>
                <a href="#" class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"> </path> </svg>
                    My Tasks
                </a>
                <a href="#" class="nav-item active">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"> </path> </svg>
                    Profile
                </a>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="breadcrumb">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"> </path> </svg>
                    <span> / </span>
                    <span class="breadcrumb-active"> Profile </span>
                </div>
                <div class="header-right">
                    <button class="notification-btn">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"> </path> </svg>
                    </button>
                    <div class="user-info">
                        <img src="../img/Profile Avatar.png" alt="User" class="user-avatar">
                        <div class="user-details">
                            <div class="user-name" id="user-email"> user@email.com </div>
                            <div class="user-role"> Student </div>
                        </div>
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"> </path> </svg>
                    </div>
                    <button class="logout-btn" id="logout-btn">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"> </path> </svg>
                    </button>
                </div>
            </header>
            <!-- Content -->
            <div class="content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title"> Profile Settings </h1>
                        <p class="page-subtitle"> Manage your account information and preferences. </p>
                    </div>
                </div>
                <div class="profile-form-container">
                    <form id="profile-form">
                        <div class="form-group">
                            <label for="fullname"> Full Name </label>
                            <input type="text" id="fullname" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="email"> Email </label>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                        <button type="submit" class="save-btn"> Save Changes </button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
