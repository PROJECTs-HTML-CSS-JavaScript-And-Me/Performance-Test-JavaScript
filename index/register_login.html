<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Register | CRUDTASK </title>
        <link rel="stylesheet" href="../css/register.css">
    </head>
    <body>
        <div class="container">
            <div class="logo-section">
                <div class="logo">
                    <img src="../img/Background.svg" alt="Logo" class="logo-icon">
                    <span class="logo-text"> CRUDZASO </span>
                </div>
            </div>
            <div class="register-card">
                <h1> Create account </h1>
                <p class="subtitle"> Join the academic performance platform today </p>
                <form id="register-form">
                    <div class="form-group">
                        <label for="fullname"> Full Name </label>
                        <input type="text" id="fullname" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" placeholder="student@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Confirm password" required>
                    </div>
                    <button type="submit" class="register-btn"> Register </button>
                </form>
                <div class="signin-section"> Already have an account? <a href="./login.html" id="link-signin"> Sign in </a> </div>
            </div>
        </div>
    </body>
</html>
