<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Create New Task - CRUDTASK </title>
        <!-- Custom CSS -->
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/dashboard.css">
        <!-- Bootstrap Styles + Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>
    <body>
        <div class="dashboard-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <div class="logo-icon"> <img src="../img/Background.svg" alt="Img-Icon"> </div>
                        <span> CRUDZASO </span>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <a href="./dashboard.html" class="nav-item"> <i class="bi bi-grid"> </i> Dashboard </a>
                    <a href="./dashboard.html" class="nav-item"> <i class="bi bi-check-square"> </i> My Tasks </a>
                    <a href="./profile.html" class="nav-item"> <i class="bi bi-person"> </i> Profile </a>
                </nav>
            </aside>
            <!-- Main Content -->
            <main class="main-content">
                <!-- Header -->
                <header class="header">
                    <div class="breadcrumb"> <i class="bi bi-house-door"> </i> <span class="breadcrumb-separator"> > </span>
                        <a href="#" onclick="history.back()" style="color: var(--text-secondary); text-decoration: none;"> Dashboard </a>
                        <span class="breadcrumb-separator"> > </span> <span> Create New </span>
                    </div>
                    <div class="header-actions">
                        <button class="notification-btn"> <i class="bi bi-bell"> </i> <span class="notification-badge"> </span> </button>
                        <div class="user-menu">
                            <div id="user-avatar" class="user-avatar"> AM </div>
                            <div class="user-info">
                                <div id="user-name" class="user-name"> Alex Morgan </div>
                                <div id="user-role" class="user-role"> Admin </div>
                            </div>
                        </div>
                        <button id="logout-btn" class="logout-btn" title="Cerrar sesión"> <i class="bi bi-box-arrow-right"> </i> </button>
                    </div>
                </header>            
                <!-- Page Content -->
                <div class="page-container">
                    <a href="#" onclick="history.back()" class="back-link"> <i class="bi bi-arrow-left"> </i> Back to Tasks </a>
                    <div class="page-header"> <h1 class="page-title"> Create New Task </h1> </div>
                    <!-- Task Form --> 
                    <div class="form-card">
                        <form id="task-form">
                            <!-- Task Title -->
                            <div class="form-group">
                                <label for="title" class="form-label required"> Task Title </label>
                                <input type="text" id="title" class="form-control" placeholder="e.g., Complete Quarter 3 Report" required>
                            </div>
                            <!-- Category and Priority -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="category" class="form-label"> Category </label>
                                    <select id="category" class="form-control" required>
                                        <option value=""> Select category... </option>
                                        <option value="Documentation"> Documentation </option>
                                        <option value="Development"> Development </option>
                                        <option value="Review"> Review </option>
                                        <option value="Database"> Database </option>
                                        <option value="Testing"> Testing </option>
                                        <option value="Design"> Design </option>
                                        <option value="Other"> Other </option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="priority" class="form-label"> Priority </label>
                                    <select id="priority" class="form-control" required>
                                        <option value="Low"> Low </option>
                                        <option value="Medium" selected> Medium </option>
                                        <option value="High"> High </option>
                                    </select>
                                </div>
                            </div>
                            <!-- Status and Due Date -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="status" class="form-label"> Status </label>
                                    <select id="status" class="form-control" required>
                                        <option value="Pending" selected> Pending </option>
                                        <option value="In Progress"> In Progress </option>
                                        <option value="Completed"> Completed </option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="dueDate" class="form-label"> Due Date </label>
                                    <input type="date" id="dueDate" class="form-control" required>
                                </div>
                            </div>
                            <!-- Assignee (solo visible para admin) -->
                            <div id="assignee-group" class="form-group d-none">
                                <label for="assignee" class="form-label"> Assignee </label>
                                <select id="assignee" class="form-control">
                                    <option value="">Select user...</option>
                                </select>
                            </div>
                            <!-- Description -->
                            <div class="form-group">
                                <label for="description" class="form-label"> Description </label>
                                <textarea id="description" class="form-control" placeholder="Add details about this task..." rows="5"> </textarea>
                            </div>
                            <!-- Form Actions -->
                            <div class="form-actions">
                                <button type="button" id="cancel-btn" class="btn btn-outline"> Cancel </button>
                                <button type="submit" id="submit-btn" class="btn btn-primary"> <i class="bi bi-save"> </i> Save Task </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
        <!-- Scripts -->
        <script src="../js/config.js"> </script>
        <script src="../js/create-task.js"> </script>
    </body>
</html>
