<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Login | CRUDTASK </title>
        <link rel="stylesheet" href="../css/login.css">
    </head>
    <body>
        <div class="container">
            <div class="logo-section">
                <div class="logo">
                    <img src="../img/Background.svg" alt="Logo" class="logo-icon">
                    <span class="logo-text"> CRUDZASO </span>
                </div>
            </div>
            <div class="login-card">
                <h1> Welcome back </h1>
                <p class="subtitle"> Enter your credentials to access the platform </p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email"> Email or username </label>
                        <input type="text" id="email" placeholder="student@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" id="toggle-password">
                                <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"> </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"> </path>
                                </svg>
                            </button>
                        </div>
                        <div class="forgot-password"> <a href="#"> Forgot password? </a> </div>
                    </div>
                    <button type="submit" class="sign-in-btn"> Sign in </button>
                </form>
                <div class="register-section"> Don't have an account? <a href="./register_login.html" id="link-register"> Register </a> </div>
            </div>
        </div>
    </body>
</html>
