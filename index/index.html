<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Iniciar Sesión - CRUDTASK </title>
        <!-- Custom CSS -->
        <link rel="stylesheet" href="../css/styles.css">
        <!-- Bootstrap Styles + Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-card">
                <!-- Logo -->
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div class="logo" style="justify-content: center;">
                        <div class="logo-icon"> <img src="../img/Background.svg" alt="Img-Icon"> </div>
                        <span> CRUDZASO </span>
                    </div>
                </div>
                <!-- Header -->
                <div class="auth-header">
                    <h1> Welcome back </h1>
                    <p> Enter your credentials to access the platform </p>
                </div>
                <!-- Alert Container -->
                <div id="alert-container"> </div>
                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label for="email" class="form-label"> Email or username </label>
                        <input type="email" id="email" class="form-control" placeholder="student@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label"> Password </label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required> <i class="bi bi-eye input-icon" onclick="togglePasswordVisibility('password')"> </i>
                        </div>
                    </div>
                    <div style="text-align: right; margin-bottom: 1.5rem;"> <a href="#" class="link"> Forgot password? </a> </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg"> Sign in </button>
                </form>
                <!-- Register Link -->
                <div class="text-center" style="margin-top: 1.5rem; color: var(--text-secondary);"> Don't have an account? <a href="./register.html" class="link"> Register </a> </div>
            </div>
        </div>
        <!-- Scripts -->
        <script src="../js/config.js"> </script>
        <script src="../js/auth.js"> </script>
    </body>
</html>
